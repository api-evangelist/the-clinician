aid: the-clinician
name: The Clinician
description: >-
  The Clinician is a New Zealand-headquartered digital health company whose product, The Clinician
  Platform (TCP, formerly ZEDOC), is an outcomes-intelligence layer for value-based healthcare. TCP
  captures patient-reported outcome and experience measures (PROMs, PREMs, CROMs) omnichannel over
  SMS, email, web and native mobile in 20+ languages, scores and benchmarks them automatically
  against MCID thresholds, runs configurable digital care pathways with a threshold-triggered alert
  engine, and returns outcomes to the EMR via FHIR. It sits alongside an EMR/PAS rather than
  replacing it, and the company markets an API-driven architecture aligned with HL7 FHIR
  (incl. SMART-on-FHIR), HL7 v2.x, openEHR and DICOM, plus an OMOP Clinical Events API. No public
  API reference, developer portal or machine-readable contract is published — API access runs
  through an enterprise sales engagement.
