domain_standard_signature:
  verified: false
  reason: >-
    domain_standard_conformance reads the CONTRACT, and The Clinician publishes
    none. The health regime's standard shortlist (fhir, smart-on-fhir, us-core,
    uscdi, da-vinci, carin-blue-button, fhir-bulk-data, cds-hooks, c-cda, hl7-v2,
    dicom) was probed for on every reachable host — no CapabilityStatement, no
    /metadata endpoint, no /.well-known/smart-configuration, no OpenAPI. Four of
    the shortlist (fhir, smart-on-fhir, hl7-v2, dicom) are claimed in prose on
    the company's own homepage and are recorded above as `claimed`, which is
    honestly weaker than a signature in a contract and must not be scored as one.
  remedy: >-
    Publish a FHIR CapabilityStatement (or an OpenAPI for the OMOP Clinical
    Events API) at a stable public URL. A single conformance resource would turn
    four prose claims into a machine-checkable fact for every prospective buyer.
