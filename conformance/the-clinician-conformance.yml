generated: '2026-09-02'
method: searched
source: https://theclinician.com/
description: >-
  Standards and compliance posture asserted by The Clinician on its own public
  surface, plus what could be verified by probe. CRITICAL CAVEAT ON PROVENANCE:
  The Clinician publishes NO machine-readable contract (no OpenAPI, GraphQL SDL,
  AsyncAPI, WSDL or .proto was found on any host — see x-coverage in apis.yml),
  so every clinical-interoperability entry below is a PROSE CLAIM read from the
  enterprise capabilities section of theclinician.com, not a signature read out
  of a contract. That distinction is the whole point of
  domain_standard_conformance: a buyer who already speaks FHIR cannot confirm
  from anything The Clinician publishes that a bespoke connector is unnecessary.
standards:
  - id: rfc9116
    conforms: true
    method: probed
    evidence: >-
      https://theclinician.com/.well-known/security.txt returns HTTP 200
      text/plain with Contact, Expires, Preferred-Languages, Canonical and Policy
      fields. Unsigned; Encryption/Acknowledgments/CSAF deliberately omitted and
      the omission is documented in the file itself.
  - id: fhir
    conforms: claimed
    method: searched
    evidence: >-
      "API-driven architecture aligned with HL7 FHIR (including SMART-on-FHIR),
      HL7 v2.x, openEHR and DICOM" and "Outcomes returned to the EMR via FHIR" —
      https://theclinician.com/ (enterprise capabilities). No CapabilityStatement,
      FHIR base URL or conformance resource is published.
  - id: smart-on-fhir
    conforms: claimed
    method: searched
    evidence: >-
      Named explicitly in the interoperability capability statement on
      https://theclinician.com/. No SMART .well-known/smart-configuration is
      served on any reachable host.
  - id: hl7-v2
